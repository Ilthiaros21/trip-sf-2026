<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SF Bay Area — Raúl &amp; Pao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta cálida y clara — Darlington (sage) / Beeswax (ámbar) / Grenadine (naranja-rojo) / Cafe Latte (café). Nada de negro, nada de mostaza. */
    --bg: oklch(0.965 0.014 95);
    --bg-elevated: oklch(0.91 0.028 145);
    --surface: oklch(0.995 0.006 90);
    --surface-solid: oklch(0.98 0.008 90);
    --border: oklch(0.45 0.04 60 / 0.22);
    --border-strong: oklch(0.4 0.045 60 / 0.35);
    --hairline: oklch(0.3 0.03 60 / 0.09);
    --text: oklch(0.3 0.035 55);
    --text-dim: oklch(0.46 0.04 55);
    --text-faint: oklch(0.5 0.032 60);
    --accent: oklch(0.55 0.185 34);
    --accent-strong: oklch(0.48 0.2 31);
    --accent-ink: oklch(0.99 0.008 85);
    --confirmed: oklch(0.4 0.1 150);
    --pending: oklch(0.46 0.14 65);
    --danger: oklch(0.48 0.19 22);

    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    --space-2xl: 32px;
    --space-3xl: 48px;

    --radius-shell: 28px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;

    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-display: "Bricolage Grotesque", -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);

    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  html {
    background: var(--bg);
    height: -webkit-fill-available;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Warm ambient washes — soft sage/beeswax/terracotta over the cream ground, no dark orbs */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 500px at 12% -8%, oklch(0.88 0.05 150 / 0.55), transparent 60%),
      radial-gradient(700px 460px at 105% 4%, oklch(0.85 0.08 70 / 0.4), transparent 55%),
      radial-gradient(600px 700px at 50% 120%, oklch(0.82 0.08 40 / 0.28), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------------------------------------------------------------
     App bar: title + mode switch + active nav, ALL ONE sticky unit.
     (Two independent sticky siblings both at top:0 would fight for
     the same band and overlap — one unit avoids that entirely.)
     --------------------------------------------------------------- */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(var(--space-xl) + env(safe-area-inset-top)) var(--space-lg) var(--space-md);
    background: color-mix(in oklch, var(--bg) 80%, transparent);
  }
  @supports (backdrop-filter: blur(1px)) {
    .app-bar { backdrop-filter: blur(28px) saturate(160%); }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent-strong);
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
    border-radius: 999px;
    padding: 4px 11px 4px 9px;
    margin-bottom: var(--space-md);
  }
  .eyebrow::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--confirmed);
    flex: 0 0 auto;
  }

  .trip-title {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    text-wrap: balance;
    margin: 0 0 3px;
  }
  .trip-sub {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin: 0 0 var(--space-md);
  }

  /* Mode switch — segmented control, two big targets */
  .mode-switch {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: color-mix(in oklch, var(--bg-elevated) 72%, transparent);
    box-shadow: 0 8px 30px -12px oklch(0.3 0.03 60 / 0.18), inset 0 1px 0 var(--hairline);
    margin-bottom: var(--space-sm);
  }
  .mode-btn {
    flex: 1;
    min-height: 46px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.3s var(--ease-spring), color 0.3s var(--ease-spring), transform 0.3s var(--ease-spring);
  }
  .mode-btn:active { transform: scale(0.97); }
  .mode-btn[aria-selected="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 14px -4px color-mix(in oklch, var(--accent) 60%, transparent);
  }
  .mode-btn:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
  }

  /* Fluid island nav — detached floating glass pill, not edge-to-edge */
  nav.tabs {
    display: flex;
    gap: var(--space-xs);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: color-mix(in oklch, var(--bg-elevated) 72%, transparent);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    box-shadow: 0 8px 30px -12px oklch(0.3 0.03 60 / 0.18), inset 0 1px 0 var(--hairline);
  }
  @supports (backdrop-filter: blur(1px)) {
    nav.tabs { backdrop-filter: blur(22px) saturate(150%); }
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs[hidden] { display: none; }

  .tab-btn {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 0 var(--space-lg);
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.3s var(--ease-spring), color 0.3s var(--ease-spring), transform 0.3s var(--ease-spring);
  }
  .tab-btn:active { transform: scale(0.96); }
  .tab-btn[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 14px -4px color-mix(in oklch, var(--accent) 60%, transparent);
  }
  .tab-btn:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
  }

  main {
    position: relative;
    z-index: 1;
    padding: 0 var(--space-lg) calc(var(--space-3xl) + env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
  }

  .mode-group[hidden] { display: none; }

  section.day-panel { display: none; }
  section.day-panel[data-active="true"] { display: block; }

  .day-heading {
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    margin: var(--space-2xl) 0 var(--space-md);
  }
  .day-heading:first-child { margin-top: var(--space-lg); }

  .day-note {
    font-size: 0.85rem;
    color: var(--text-faint);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-md);
    margin-bottom: var(--space-lg);
    line-height: 1.5;
  }

  /* timeline */
  .timeline {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    position: relative;
  }

  .block {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: var(--space-sm);
    position: relative;
  }

  /* slim spine — just the dot + connecting line, no time text (time lives in the card now) */
  .block-time-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 22px;
  }
  .block-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--confirmed);
    flex: 0 0 auto;
  }
  .block[data-status="pending"] .block-dot {
    background: transparent;
    border: 2px solid var(--pending);
  }
  .block-line {
    width: 1px;
    flex: 1;
    background: var(--border);
    margin-top: var(--space-sm);
  }
  .block:last-child .block-line { display: none; }

  /* Double-bezel: outer machined shell + inner glass core */
  .bezel-shell {
    background: color-mix(in oklch, var(--bg-elevated) 55%, transparent);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-shell);
    padding: 5px;
  }
  .block[data-status="pending"] .bezel-shell,
  .bezel-shell.is-pending {
    border-color: color-mix(in oklch, var(--pending) 35%, transparent);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: inset 0 1px 0 var(--hairline);
    overflow: hidden;
  }
  @supports (backdrop-filter: blur(1px)) {
    .card { backdrop-filter: blur(18px); }
  }
  .block[data-status="pending"] .card,
  .card.is-pending {
    border-style: dashed;
    border-color: var(--pending);
    background: color-mix(in oklch, var(--pending) 6%, var(--surface));
  }

  .card-head {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    padding: var(--space-lg);
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    min-height: 44px;
    transition: transform 0.3s var(--ease-spring);
  }
  .card-head:active { transform: scale(0.99); }
  .card-head:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: -2px;
  }

  /* board-line: hora grande tipo tablero de salidas + status + chevron, todo en una fila */
  .card-head-top {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    perspective: 400px;
  }
  .block-time {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text);
    line-height: 1;
  }
  .card-head-spacer { flex: 1 1 auto; }

  .card-title-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card-title {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-location {
    font-size: 0.8rem;
    color: var(--text-faint);
  }
  .card-desc {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.45;
  }

  .status-pill {
    flex: 0 0 auto;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    background: color-mix(in oklch, var(--confirmed) 20%, transparent);
    color: var(--confirmed);
    white-space: nowrap;
  }
  .block[data-status="pending"] .status-pill,
  .status-pill.is-pending {
    background: color-mix(in oklch, var(--pending) 22%, transparent);
    color: var(--pending);
  }

  /* button-in-button: chevron nested in its own pill, never bare */
  .chevron-wrap {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s var(--ease-spring), background 0.3s var(--ease-spring);
  }
  .card-head:hover .chevron-wrap { background: color-mix(in oklch, var(--accent) 16%, var(--bg-elevated)); }
  .chevron {
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    transition: transform 0.35s var(--ease-spring);
  }
  .card[data-open="true"] .chevron { transform: rotate(180deg); }

  .card-body-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s var(--ease-spring);
  }
  .card[data-open="true"] .card-body-wrap { grid-template-rows: 1fr; }
  .card-body-inner { overflow: hidden; }
  .card-body {
    padding: 0 var(--space-lg) var(--space-lg);
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.55;
    border-top: 1px solid var(--hairline);
    margin-top: var(--space-sm);
    padding-top: var(--space-md);
  }
  .card-body p { margin: 0 0 var(--space-sm); }
  .card-body p:last-child { margin-bottom: 0; }

  .badge-warn {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--danger);
    background: color-mix(in oklch, var(--danger) 16%, transparent);
    border-radius: 6px;
    padding: 2px 8px;
    margin-bottom: var(--space-sm);
  }

  /* food options widget */
  .food-options {
    margin-top: var(--space-md);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }
  .food-options-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
  }
  .food-opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    padding: var(--space-sm) var(--space-md);
  }
  .food-opt-name { font-size: 0.85rem; font-weight: 600; }
  .food-opt-desc { font-size: 0.76rem; color: var(--text-faint); margin-top: 1px; }
  .food-tag {
    flex: 0 0 auto;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .food-tag[data-kind="walk"] {
    background: color-mix(in oklch, var(--confirmed) 18%, transparent);
    color: var(--confirmed);
  }
  .food-tag[data-kind="move"] {
    background: color-mix(in oklch, var(--accent) 12%, transparent);
    color: var(--accent-strong);
  }

  /* pretrip checklist grouping label — sits above its own .checklist block */
  .pretrip-when {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent-strong);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: var(--space-xl) 0 var(--space-sm);
  }
  .pretrip-when:first-of-type { margin-top: 0; }

  /* summary tab */
  .summary-grid { display: flex; flex-direction: column; gap: var(--space-xl); }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: inset 0 1px 0 var(--hairline);
    padding: var(--space-xl) var(--space-lg);
  }
  @supports (backdrop-filter: blur(1px)) {
    .summary-card { backdrop-filter: blur(18px); }
  }
  .summary-card h2 {
    font-family: var(--font-mono);
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent-strong);
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 28%, transparent);
    border-radius: 999px;
    padding: 4px 11px;
    margin: 0 0 var(--space-lg);
  }
  .summary-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-sm) 0;
    border-top: 1px solid var(--hairline);
  }
  .summary-row:first-of-type { border-top: none; }
  .summary-row-label {
    color: var(--text-faint);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .summary-row-value { font-size: 0.9rem; font-weight: 600; line-height: 1.4; }
  .summary-row-value.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.86rem; }

  .allergy-card {
    background: color-mix(in oklch, var(--danger) 12%, var(--surface));
    border: 1px solid color-mix(in oklch, var(--danger) 45%, var(--border));
  }
  .allergy-card h2 {
    color: var(--danger);
    background: color-mix(in oklch, var(--danger) 18%, transparent);
    border-color: color-mix(in oklch, var(--danger) 40%, transparent);
  }
  .allergy-card p { margin: 0; font-size: 0.9rem; line-height: 1.5; }

  .pill-list { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
  .pill {
    font-size: 0.8rem;
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .hotel-options { display: flex; flex-direction: column; gap: var(--space-sm); }
  .hotel-opt {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-sm);
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    padding: var(--space-sm) var(--space-md);
    font-size: 0.85rem;
  }
  .hotel-opt[data-picked="true"] {
    border-color: var(--accent);
    background: color-mix(in oklch, var(--accent) 10%, var(--bg-elevated));
  }
  .hotel-name { font-weight: 600; }
  .hotel-price { color: var(--text-faint); font-size: 0.78rem; }

  /* ---------------------------------------------------------------
     Checklists (Documentos, Ropa) — real toggle state, per-device
     via localStorage. Still no server, still no cross-device sync.
     --------------------------------------------------------------- */
  .checklist { display: flex; flex-direction: column; gap: var(--space-sm); margin-bottom: var(--space-lg); }
  .check-row {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: inset 0 1px 0 var(--hairline);
    cursor: pointer;
    min-height: 44px;
    transition: background 0.25s var(--ease-spring);
  }
  .check-row:active { transform: scale(0.995); }
  .check-box {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: background 0.25s var(--ease-spring), border-color 0.25s var(--ease-spring), color 0.15s var(--ease-spring);
  }
  .check-row.is-checked .check-box {
    background: var(--confirmed);
    border-color: var(--confirmed);
    color: var(--bg);
  }
  .check-label { font-size: 0.92rem; line-height: 1.4; transition: color 0.25s ease, opacity 0.25s ease; }
  .check-row.is-checked .check-label { color: var(--text-faint); text-decoration: line-through; opacity: 0.75; }

  .ropa-columns { display: flex; flex-direction: column; gap: var(--space-2xl); }
  .ropa-col-title {
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 var(--space-md);
  }

  /* Seguridad — contact cards with tap-to-call / tap-to-map */
  .contact-card-value { font-size: 0.95rem; font-weight: 600; margin-top: 2px; }
  .contact-card-note { font-size: 0.8rem; color: var(--text-faint); margin-top: 4px; line-height: 1.4; }
  .contact-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-md); }
  .contact-link {
    flex: 1;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    transition: background 0.25s var(--ease-spring), transform 0.25s var(--ease-spring);
  }
  .contact-link:active { transform: scale(0.97); }
  .contact-link.is-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  footer.credits {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.72rem;
    padding: var(--space-xl) 0 var(--space-lg);
  }

  .day-panel[data-active="true"] > .day-note { animation-delay: 0.04s; }
  .day-panel[data-active="true"] .timeline > *,
  .day-panel[data-active="true"] .checklist > * {
    animation: riseIn 0.55s var(--ease-spring) both;
  }
  .day-panel[data-active="true"] .timeline > *:nth-child(1),
  .day-panel[data-active="true"] .checklist > *:nth-child(1) { animation-delay: 0.05s; }

  .day-panel[data-active="true"] .timeline > *:nth-child(4),
  .day-panel[data-active="true"] .checklist > *:nth-child(4) { animation-delay: 0.2s; }
  .day-panel[data-active="true"] .timeline > *:nth-child(5),
  .day-panel[data-active="true"] .checklist > *:nth-child(5) { animation-delay: 0.25s; }
  .day-panel[data-active="true"] .timeline > *:nth-child(n+6),
  .day-panel[data-active="true"] .checklist > *:nth-child(n+6) { animation-delay: 0.3s; }
  .day-panel[data-active="true"] .summary-grid > * { animation: riseIn 0.55s var(--ease-spring) both; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(1) { animation-delay: 0.04s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(2) { animation-delay: 0.09s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(3) { animation-delay: 0.14s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(4) { animation-delay: 0.19s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(n+5) { animation-delay: 0.24s; }

  /* ---------------------------------------------------------------
     Flight-board scroll reveal — each moment card animates in as it
     scrolls into view (per-card, not a one-shot stagger), with the
     time readout doing a quick flap-in — nod to the split-flap board
     that's this app's visual lineage. CSS-only, scroll-driven.
     Browsers without `animation-timeline: view()` (Firefox, as of
     this writing) keep the existing JS tab-activation stagger above
     instead — real fallback, not a degraded copy.
     --------------------------------------------------------------- */
  @supports (animation-timeline: view()) {
    .day-panel[data-active="true"] .timeline > * { animation: none !important; }

    .timeline > .block {
      opacity: 0;
      animation: flapReveal 0.6s var(--ease-spring) both;
      animation-timeline: view();
      animation-range: entry 0% entry 45%;
    }
    .timeline > .block .block-time {
      transform-origin: 50% 100%;
      animation: flapDigit 0.45s var(--ease-spring) both;
      animation-timeline: view();
      animation-range: entry 5% entry 40%;
    }
  }
  @keyframes flapReveal {
    from { opacity: 0; transform: translateY(16px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes flapDigit {
    from { opacity: 0; transform: rotateX(-85deg); }
    to   { opacity: 1; transform: rotateX(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card-body-wrap, .chevron, .tab-btn, .card-head, .mode-btn, .check-row,
    .day-panel[data-active="true"] > *, .day-panel[data-active="true"] .timeline > *,
    .day-panel[data-active="true"] .checklist > *, .day-panel[data-active="true"] .summary-grid > *,
    .timeline > .block, .timeline > .block .block-time {
      transition: none !important;
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  @media (min-width: 720px) {
    main { max-width: 760px; }
    .ropa-columns { flex-direction: row; align-items: flex-start; }
    .ropa-columns > * { flex: 1; }
    /* Breakpoint-free responsive grid — card count varies per panel now that Resumen is gone */
    #panel-pretrip .summary-grid,
    #panel-seguridad .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-xl);
    }
  }
</style>

        if (!block[field]) errors.push("days[" + i + "].blocks[" + j + "] falta '" + field + "'");

      if (block.status !== "confirmed" && block.status !== "pending") {

      }
    });
  });
  if (errors.length) {
    console.error("TRIP_DATA inválido:\n- " + errors.join("\n- "));

  return errors.length === 0;
}

    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach(function (c) {
    if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function chevronSvg() {
  const chevron = document.createElement("span");
  chevron.className = "chevron";
  chevron.innerHTML = '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const wrap = document.createElement("span");
  wrap.className = "chevron-wrap";
  wrap.appendChild(chevron);
  return wrap;
}

// Double-bezel: outer machined shell wrapping an inner glass core.
function shell(coreNode, extraClass) {
  return el("div", { class: "bezel-shell" + (extraClass ? " " + extraClass : "") }, [coreNode]);
}

function renderFoodOptions(food) {
  const wrap = el("div", { class: "food-options" }, [
    el("div", { class: "food-options-label" }, [food.label])
  ]);
  food.options.forEach(function (opt) {
    wrap.appendChild(el("div", { class: "food-opt" }, [
      el("div", null, [
        el("div", { class: "food-opt-name" }, [opt.name]),
        el("div", { class: "food-opt-desc" }, [opt.desc])
      ]),
      el("span", { class: "food-tag", "data-kind": opt.tag }, [opt.tag === "walk" ? "Walkable" : "Vale la pena"])
    ]));
  });
  return wrap;
}

function renderBlock(block) {
  const status = block.status === "pending" ? "pending" : "confirmed";
  const hasBody = block.notes || block.food || block.warn;

  // Board-line: hora grande + status + chevron, una sola fila (tipo tablero de salidas)
  const headTop = el("div", { class: "card-head-top" }, [
    el("span", { class: "block-time" }, [block.time]),
    el("span", { class: "card-head-spacer" }),
    el("span", { class: "status-pill" }, [status === "pending" ? "Por confirmar" : "Confirmado"])
  ]);
  if (hasBody) headTop.appendChild(chevronSvg());

  const titleGroup = el("div", { class: "card-title-group" }, [
    el("div", { class: "card-title" }, [block.title]),
    block.location ? el("div", { class: "card-location" }, [block.location]) : null,
    block.desc ? el("div", { class: "card-desc" }, [block.desc]) : null
  ]);

  const head = el("button", { class: "card-head", type: "button", "aria-expanded": "false" }, [headTop, titleGroup]);

  const card = el("div", { class: "card", "data-open": "false" }, [head]);

  if (hasBody) {
    const bodyContent = el("div", { class: "card-body" });
    if (block.warn) {
      bodyContent.appendChild(el("span", { class: "badge-warn" }, ["⚠ Importante"]));
      bodyContent.appendChild(el("p", null, [block.warn]));
    }
    if (block.notes) bodyContent.appendChild(el("p", null, [block.notes]));
    if (block.food) bodyContent.appendChild(renderFoodOptions(block.food));

    const inner = el("div", { class: "card-body-inner" }, [bodyContent]);
    const bodyWrap = el("div", { class: "card-body-wrap" }, [inner]);
    card.appendChild(bodyWrap);
  } else {
    head.style.cursor = "default";
  }

  const dotCol = el("div", { class: "block-time-col" }, [
    el("div", { class: "block-dot" }),
    el("div", { class: "block-line" })
  ]);

  return el("article", { class: "block", "data-status": status }, [dotCol, shell(card)]);
}

// Delegación: un solo listener por panel, no uno por tarjeta.
function bindExpandDelegate(container) {
  container.addEventListener("click", function (event) {
    const head = event.target.closest(".card-head");
    if (!head || !container.contains(head)) return;
    const card = head.closest(".card");
    if (!card || !card.querySelector(".card-body-wrap")) return;
    const open = card.getAttribute("data-open") === "true";
    card.setAttribute("data-open", open ? "false" : "true");
    head.setAttribute("aria-expanded", open ? "false" : "true");
  });
}

function checkSvg() {
  const s = document.createElement("span");
  s.innerHTML = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path d="M2.5 8.5L6 12L13.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return s.firstChild;
}

function renderCheckRow(item, storageKey) {
  const box = el("span", { class: "check-box" }, [checkSvg()]);
  const label = el("span", { class: "check-label" }, [item.label]);
  const row = el("div", {
    class: "check-row", role: "checkbox", tabindex: "0",
    "aria-checked": "false", "data-key": storageKey
  }, [box, label]);
  return row;
}

function renderChecklist(items, keyPrefix) {
  const wrap = el("div", { class: "checklist" });
  items.forEach(function (item) {
    wrap.appendChild(renderCheckRow(item, keyPrefix + "_" + item.key));
  });
  return wrap;
}

// Delegación: toggle de checkbox + persistencia en localStorage.
function bindChecklistDelegate(container) {
  function toggle(row) {
    const checked = row.getAttribute("aria-checked") === "true";
    row.setAttribute("aria-checked", checked ? "false" : "true");
    row.classList.toggle("is-checked", !checked);
    saveCheck(row.dataset.key, !checked);
  }
  container.addEventListener("click", function (event) {
    const row = event.target.closest(".check-row");
    if (!row || !container.contains(row)) return;
    toggle(row);
  });
  container.addEventListener("keydown", function (event) {
    if (event.key !== " " && event.key !== "Enter") return;
    const row = event.target.closest(".check-row");
    if (!row || !container.contains(row)) return;
    event.preventDefault();
    toggle(row);
  });
}

function hydrateChecklists(root) {
  root.querySelectorAll(".check-row").forEach(function (row) {
    if (loadCheck(row.dataset.key)) {
      row.setAttribute("aria-checked", "true");
      row.classList.add("is-checked");
    }
  });
}

function renderDayPanel(day) {
  const panel = el("section", { class: "day-panel", id: "panel-" + day.key, role: "tabpanel", "aria-labelledby": "tab-" + day.key });
  panel.appendChild(el("h2", { class: "day-heading" }, [day.heading]));
  if (day.note) panel.appendChild(el("p", { class: "day-note" }, [day.note]));
  const timeline = el("div", { class: "timeline" });
  day.blocks.forEach(function (b) { timeline.appendChild(renderBlock(b)); });
  panel.appendChild(timeline);
  return panel;
}

function renderPretripPanel() {
  const panel = el("section", { class: "day-panel", id: "panel-pretrip", role: "tabpanel", "aria-labelledby": "tab-pretrip" });
  panel.appendChild(el("h2", { class: "day-heading" }, ["Antes de viajar"]));
  panel.appendChild(el("p", { class: "day-note" }, ["Checklist con casillas — se guarda en este teléfono, no se sincroniza con el de la otra persona."]));

  TRIP_DATA.pretrip.forEach(function (group) {
    const groupItems = group.tasks.map(function (t) { return { key: t.key, label: t.label }; });
    const checklist = renderChecklist(groupItems, "pretrip");
    panel.appendChild(el("div", { class: "pretrip-when" }, [group.when]));
    panel.appendChild(checklist);
  });

  const grid = el("div", { class: "summary-grid" });

  grid.appendChild(shell(el("div", { class: "summary-card" }, [
    el("h2", null, ["Hospedaje"]),
    el("div", { class: "hotel-options" }, [
      el("div", { class: "hotel-opt", "data-picked": "true" }, [
        el("div", null, [
          el("div", { class: "hotel-name" }, ["Aloft Mountain View — inclinación actual"]),
          el("div", { class: "hotel-price" }, ["840 East El Camino Real, Mountain View, CA 94040 · $130–180/noche"])
        ]),
        el("span", { class: "status-pill" }, ["Por confirmar"])
      ]),
      el("div", { class: "hotel-opt" }, [
        el("div", null, [
          el("div", { class: "hotel-name" }, ["Hyatt Centric Mountain View"]),
          el("div", { class: "hotel-price" }, ["$200–350/noche"])
        ])
      ]),
      el("div", { class: "hotel-opt" }, [
        el("div", null, [
          el("div", { class: "hotel-name" }, ["Residence Inn Palo Alto/Mountain View"]),
          el("div", { class: "hotel-price" }, ["$130–160/noche"])
        ])
      ])
    ])
  ])));

  grid.appendChild(shell(el("div", { class: "summary-card" }, [
    el("h2", null, ["Presupuesto &amp; dinero"]),
    summaryRow("Presupuesto total", "$25,000 USD (incluye todo)", true),
    summaryRow("Estimado real", "~$3,500–4,800 USD para los dos", true),
    summaryRow("Cash", "~$100–150 USD de colchón, resto tarjeta/Apple Pay"),
    summaryRow("Transporte", "Default a Caltrain/caminar — Uber solo casos puntuales")
  ])));

  panel.appendChild(grid);
  return panel;
}

function renderDocumentosPanel() {
  const panel = el("section", { class: "day-panel", id: "panel-documentos", role: "tabpanel", "aria-labelledby": "tab-documentos" });
  panel.appendChild(el("h2", { class: "day-heading" }, ["Documentos"]));
  panel.appendChild(el("p", { class: "day-note" }, ["Revisar antes de salir de casa. Se guarda en este teléfono — no se sincroniza con el de la otra persona."]));
  panel.appendChild(renderChecklist(DOCUMENTOS_CHECKLIST, "doc"));

  const pendingCard = el("div", { class: "card is-pending" }, [
    el("div", { class: "card-head", style: "cursor:default;" }, [
      el("div", { class: "card-title-group" }, [
        el("div", { class: "card-title" }, ["Confirmación vuelo Pao"]),
        el("div", { class: "card-desc" }, ["Vía empresa — aún no existe. Se agrega aquí en cuanto la tengan."])
      ]),
      el("span", { class: "status-pill is-pending" }, ["Por confirmar"])
    ])
  ]);
  panel.appendChild(shell(pendingCard, "is-pending"));
  return panel;
}

function renderRopaPanel() {
  const panel = el("section", { class: "day-panel", id: "panel-ropa", role: "tabpanel", "aria-labelledby": "tab-ropa" });
  panel.appendChild(el("h2", { class: "day-heading" }, ["Ropa"]));
  panel.appendChild(el("p", { class: "day-note" }, ["Misma lista para los dos — ajústenla a mano si algo cambia. Cada quien tacha lo suyo en su propio teléfono."]));

  panel.appendChild(shell(el("div", { class: "summary-card" }, [
    el("h2", null, ["Equipaje"]),
    summaryRow("Maletas", "1 carry-on + 1 documentada (compartidas entre los dos, no una por persona)"),
    summaryRow("Clima fin de sept", "SF fresco/neblina 18–21°C día, ~13°C noche. Mountain View más cálido y soleado, 26–29°C día.")
  ])));

  const columns = el("div", { class: "ropa-columns" });
  columns.appendChild(el("div", null, [
    el("h3", { class: "ropa-col-title" }, ["Raúl"]),
    renderChecklist(PACKING_ITEMS, "ropa_raul")
  ]));
  columns.appendChild(el("div", null, [
    el("h3", { class: "ropa-col-title" }, ["Pao"]),
    renderChecklist(PACKING_ITEMS, "ropa_pao")
  ]));
  panel.appendChild(columns);
  return panel;
}

function contactCard(item) {
  const card = el("div", { class: "summary-card" }, [
    el("h2", null, [item.title]),
    el("div", { class: "contact-card-value" }, [item.value]),
    el("div", { class: "contact-card-note" }, [item.note])
  ]);
  const actions = el("div", { class: "contact-actions" });
  actions.appendChild(el("a", {
    class: "contact-link" + (item.isPrimary ? " is-primary" : ""),
    href: "tel:" + item.tel
  }, ["Llamar"]));
  if (item.mapQuery) {
    actions.appendChild(el("a", {
      class: "contact-link",
      href: "https://maps.google.com/?q=" + encodeURIComponent(item.mapQuery),
      target: "_blank", rel: "noopener"
    }, ["Ver mapa"]));
  }
  card.appendChild(actions);
  return card;
}

function renderSeguridadPanel() {
  const panel = el("section", { class: "day-panel", id: "panel-seguridad", role: "tabpanel", "aria-labelledby": "tab-seguridad" });
  panel.appendChild(el("h2", { class: "day-heading" }, ["Seguridad"]));
  panel.appendChild(el("p", { class: "day-note" }, ["Números y direcciones a la mano — sin tener que buscar en el momento."]));
  const grid = el("div", { class: "summary-grid" });

  // Alergia — siempre visible, no colapsable
  grid.appendChild(shell(el("div", { class: "summary-card allergy-card" }, [
    el("h2", null, ["⚠ Alergia"]),
    el("p", null, ["Raúl es alérgico a almendras y nueces de Castilla (pistaches sí). Tenerlo presente al elegir cualquier restaurante."])
  ])));

  SEGURIDAD_DATA.forEach(function (item) { grid.appendChild(shell(contactCard(item))); });
  panel.appendChild(grid);
  return panel;
}

function summaryRow(label, value, mono) {
  return el("div", { class: "summary-row" }, [
    el("span", { class: "summary-row-label" }, [label]),
    el("span", { class: "summary-row-value" + (mono ? " mono" : "") }, [value])
  ]);
}

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------

function makeTabGroup(config) {
  // config: { navEl, panelsEl, tabs: [{key,label,panel}] }
  config.tabs.forEach(function (t) {
    const btn = el("button", {
      class: "tab-btn", type: "button", role: "tab",
      id: "tab-" + t.key, "aria-controls": "panel-" + t.key,
      "aria-selected": "false"
    }, [t.label]);
    btn.addEventListener("click", function () { activateInGroup(config, t.key); });
    config.navEl.appendChild(btn);
    config.panelsEl.appendChild(t.panel);
  });
  return config;
}

function activateInGroup(config, key) {
  config.navEl.querySelectorAll(".tab-btn").forEach(function (b) {
    b.setAttribute("aria-selected", b.id === "tab-" + key ? "true" : "false");
  });
  config.panelsEl.querySelectorAll(".day-panel").forEach(function (p) {
    p.setAttribute("data-active", p.id === "panel-" + key ? "true" : "false");
  });
  const activeBtn = document.getElementById("tab-" + key);
  if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  config.activeKey = key;
}

function setMode(mode, groups) {
  const isTrip = mode === "trip";
  document.getElementById("mode-trip").setAttribute("aria-selected", isTrip ? "true" : "false");
  document.getElementById("mode-info").setAttribute("aria-selected", isTrip ? "false" : "true");

  groups.trip.navEl.hidden = !isTrip;
  groups.trip.panelsEl.hidden = !isTrip;
  groups.info.navEl.hidden = isTrip;
  groups.info.panelsEl.hidden = isTrip;
}

function boot() {
  validateTripData(TRIP_DATA);

  const tabsTrip = document.getElementById("tabs-trip");
  const panelsTrip = document.getElementById("panels-trip");
  const tabsInfo = document.getElementById("tabs-info");
  const panelsInfo = document.getElementById("panels-info");

  bindExpandDelegate(panelsTrip);
  bindExpandDelegate(panelsInfo);
  bindChecklistDelegate(panelsInfo);

  const tripGroup = makeTabGroup({
    navEl: tabsTrip, panelsEl: panelsTrip,
    tabs: TRIP_DATA.days.map(function (d) { return { key: d.key, label: d.tab, panel: renderDayPanel(d) }; })
  });

  const infoGroup = makeTabGroup({
    navEl: tabsInfo, panelsEl: panelsInfo,
    tabs: [
      { key: "pretrip", label: "Antes de viajar", panel: renderPretripPanel() },
      { key: "documentos", label: "Documentos", panel: renderDocumentosPanel() },
      { key: "ropa", label: "Ropa", panel: renderRopaPanel() },
      { key: "seguridad", label: "Seguridad", panel: renderSeguridadPanel() }
    ]
  });

  hydrateChecklists(panelsInfo);

  activateInGroup(tripGroup, TRIP_DATA.days[0].key);
  activateInGroup(infoGroup, "pretrip");

  const groups = { trip: tripGroup, info: infoGroup };
  setMode("trip", groups);

  document.getElementById("mode-trip").addEventListener("click", function () { setMode("trip", groups); });
  document.getElementById("mode-info").addEventListener("click", function () { setMode("info", groups); });
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
