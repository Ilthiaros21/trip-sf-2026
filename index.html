<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SF Bay Area — Raúl &amp; Pao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta pastel fría — lavanda/periwinkle de fondo, azul/ámbar/rosa como
       flujo decorativo del timeline. Pivote total desde la paleta cálida anterior. */
    --bg: oklch(0.94 0.018 280);
    --bg-elevated: oklch(0.895 0.026 276);
    --surface: oklch(0.995 0.005 275);
    --surface-solid: oklch(0.985 0.007 275);
    --border: oklch(0.5 0.03 275 / 0.16);
    --border-strong: oklch(0.45 0.035 275 / 0.28);
    --hairline: oklch(0.25 0.03 275 / 0.08);
    --text: oklch(0.27 0.045 265);
    --text-dim: oklch(0.44 0.04 265);
    --text-faint: oklch(0.56 0.032 265);
    --accent: oklch(0.55 0.18 265);
    --accent-strong: oklch(0.47 0.19 262);
    --accent-ink: oklch(0.99 0.006 265);
    --confirmed: oklch(0.4 0.1 155);
    --pending: oklch(0.68 0.14 75);
    --danger: oklch(0.55 0.19 20);

    /* Colores por categoría de tarjeta — pintan el spine, el dot, la
       etiqueta de tipo junto a la hora, y el glow de la tarjeta. Un solo
       color por tarjeta hilando todas esas superficies. */
    --cat-flight: oklch(0.72 0.11 240);   /* vuelos, check-in, abordaje */
    --cat-transfer: oklch(0.66 0.1 290);  /* traslados, Caltrain, Uber */
    --cat-activity: oklch(0.8 0.11 75);   /* museos, tiendas, anclas del día */
    --cat-food: oklch(0.75 0.1 345);      /* comidas */
    --cat-event: oklch(0.6 0.19 25);      /* el partido — único evento del viaje */
    --cat-rest: oklch(0.75 0.02 270);     /* despertar, libre, por definir */
    /* Fallback global — :root, no .card, para que la herencia real desde
       .block (donde JS fija el color de categoría) nunca quede tapada por
       una redeclaración de menor prioridad en la propia .card. */
    --cat-glow: var(--cat-rest);

    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    --space-2xl: 32px;
    --space-3xl: 48px;

    --radius-shell: 30px;
    --radius-lg: 22px;
    --radius-md: 18px;
    --radius-sm: 14px;

    --font-body: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-display: "Familjen Grotesk", -apple-system, sans-serif;
    --font-mono: "Hanken Grotesk", -apple-system, sans-serif;

    /* Sistema de motion direccional (skill motion-design): una curva por propósito, no una sola para todo.
       - entrance: expo-out, para apariciones grandes (stagger de tarjetas, flap reveal).
       - out: quart-out, default snappy para cambios de estado (hover, selección).
       - in: quart-in, para salidas — acelera, se siente ~75% más rápido que su entrada.
       - in-out: para toggles que van y vuelven en su lugar (chevron, checkbox). */
    --ease-entrance: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-in: cubic-bezier(0.5, 0, 0.75, 0);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

    --dur-instant: 110ms;   /* bajada del press — rápida a propósito */
    --dur-settle: 260ms;    /* vuelta del press al soltar — más lenta que la bajada, para que se sienta */
    --dur-fast: 220ms;      /* hover, color/fondo */
    --dur-base: 300ms;      /* toggles en su lugar: chevron, selección de tab, relleno de progreso */
    --dur-layout-in: 380ms; /* acordeón abre */
    --dur-layout-out: 290ms;/* acordeón cierra — ~75% del open, según regla de salida */

    color-scheme: light;
  }

  /* Registrado para poder transicionar el reveal del spine (custom property con syntax
     tipado) — funciona en cualquier motor moderno, sin animation-timeline ni JS pesado. */
  @property --reveal {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }
  /* Mismo motivo: sin esto, "background: transparent" → "conic-gradient(...)"
     es un cambio de tipo discreto — el navegador no lo interpola, salta de
     golpe aunque la regla tenga transition. Con --progress-frac registrado,
     el conic-gradient es SIEMPRE la misma función, solo cambia el corte —
     eso sí se anima suave (el dot y el botón de progreso "se llenan" de
     verdad, no aparecen llenos). */
  @property --progress-frac {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  html {
    background: var(--bg);
    height: -webkit-fill-available;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Fondo pastel con manchas suaves azul/ámbar/rosa — eco del wave de la referencia, sin asset externo */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(720px 520px at 102% -6%, oklch(0.82 0.09 240 / 0.55), transparent 60%),
      radial-gradient(640px 480px at 108% 58%, oklch(0.85 0.09 80 / 0.35), transparent 55%),
      radial-gradient(600px 600px at -12% 92%, oklch(0.82 0.09 345 / 0.32), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------------------------------------------------------------
     App bar: liquid glass — la única superficie con vidrio de verdad.
     Blur + saturate + highlight especular arriba + borde inferior que
     refracta un filo de luz. Las tarjetas de contenido NO llevan blur.
     --------------------------------------------------------------- */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(var(--space-xl) + env(safe-area-inset-top)) var(--space-lg) var(--space-md);
    background: color-mix(in oklch, var(--bg) 58%, transparent);
    isolation: isolate;
  }
  .app-bar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(165deg, oklch(1 0 0 / 0.32), transparent 42%);
    pointer-events: none;
    z-index: -1;
  }
  .app-bar::after {
    content: "";
    position: absolute;
    left: var(--space-lg);
    right: var(--space-lg);
    bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.55), transparent);
    pointer-events: none;
  }
  @supports (backdrop-filter: blur(1px)) {
    .app-bar { backdrop-filter: blur(30px) saturate(170%); }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--accent-strong);
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
    border-radius: 999px;
    padding: 4px 11px 4px 9px;
    margin-bottom: var(--space-md);
  }
  .eyebrow::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--confirmed);
    flex: 0 0 auto;
  }

  .trip-title {
    font-family: var(--font-display);
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin: 0 0 3px;
  }
  .trip-sub {
    font-size: 0.88rem;
    color: var(--text-dim);
    margin: 0 0 var(--space-md);
  }

  .mode-switch {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: color-mix(in oklch, var(--bg-elevated) 62%, transparent);
    box-shadow: 0 8px 30px -14px oklch(0.3 0.05 265 / 0.35), inset 0 1px 0 oklch(1 0 0 / 0.6);
    margin-bottom: var(--space-sm);
    position: relative;
  }
  @supports (backdrop-filter: blur(1px)) {
    .mode-switch { backdrop-filter: blur(18px) saturate(160%); }
  }
  .mode-btn {
    flex: 1;
    min-height: 46px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.94rem;
    cursor: pointer;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), transform var(--dur-settle) var(--ease-out);
  }
  .mode-btn:active { transform: scale(0.95); transition: transform var(--dur-instant) var(--ease-out); }
  .mode-btn[aria-selected="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 16px -4px color-mix(in oklch, var(--accent) 65%, transparent);
  }
  .mode-btn:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
  }

  nav.tabs {
    display: flex;
    gap: var(--space-xs);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px;
    border-radius: 999px;
    border: 1px solid var(--hairline);
    background: color-mix(in oklch, var(--bg-elevated) 62%, transparent);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    box-shadow: 0 8px 30px -14px oklch(0.3 0.05 265 / 0.35), inset 0 1px 0 oklch(1 0 0 / 0.6);
  }
  @supports (backdrop-filter: blur(1px)) {
    nav.tabs { backdrop-filter: blur(18px) saturate(160%); }
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs[hidden] { display: none; }

  .tab-btn {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 0 var(--space-lg);
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.89rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), transform var(--dur-settle) var(--ease-out);
  }
  .tab-btn:active { transform: scale(0.94); transition: transform var(--dur-instant) var(--ease-out); }
  .tab-btn[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 4px 16px -4px color-mix(in oklch, var(--accent) 65%, transparent);
  }
  .tab-btn:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
  }

  main {
    position: relative;
    z-index: 1;
    padding: 0 var(--space-lg) calc(var(--space-3xl) + env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
  }

  .mode-group[hidden] { display: none; }

  section.day-panel { display: none; }
  section.day-panel[data-active="true"] { display: block; }

  .day-heading {
    font-family: var(--font-display);
    font-size: 1.28rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    margin: var(--space-2xl) 0 var(--space-md);
  }
  .day-heading:first-child { margin-top: var(--space-lg); }

  .day-note {
    font-size: 0.87rem;
    color: var(--text-faint);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-md);
    margin-bottom: var(--space-lg);
    line-height: 1.55;
    box-shadow: 0 1px 3px oklch(0.3 0.05 265 / 0.05);
  }

  .timeline {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    position: relative;
  }

  /* ---------------------------------------------------------------
     Spine continuo — una sola tira de vidrio líquido por día, no un
     segmento por tarjeta. Se posiciona/pinta por JS (layoutSpine): su
     alto va del centro del primer dot al centro del último, y su
     degradado usa el color de categoría de cada tarjeta (vuelo,
     traslado, actividad, comida, evento, libre). El "reveal" (de
     transparente a color, conforme se hace scroll) se gobierna con la
     custom property --reveal, actualizada en cada frame de scroll.
     --------------------------------------------------------------- */
  .spine {
    position: absolute;
    left: 10px;
    width: 7px;
    margin-left: -3.5px;
    border-radius: 999px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .spine-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: inherit;
  }
  .spine-fill {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    --reveal: 0%;
    -webkit-mask-image: linear-gradient(to bottom, black calc(var(--reveal) - 6%), transparent var(--reveal));
    mask-image: linear-gradient(to bottom, black calc(var(--reveal) - 6%), transparent var(--reveal));
    transition: --reveal 60ms linear;
  }
  @supports (backdrop-filter: blur(1px)) {
    .spine-fill { backdrop-filter: blur(2px) saturate(180%); }
  }
  .spine-fill::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 2px;
    background: linear-gradient(to bottom, oklch(1 0 0 / 0.65), oklch(1 0 0 / 0.15) 40%, transparent 75%);
  }

  .block {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: var(--space-sm);
    position: relative;
    z-index: 1;
  }

  .block-time-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 26px;
  }
  /* El dot ya no marca confirmado/pendiente — marca categoría (color) y
     progreso (relleno). Vacío = solo el aro de color. A medio llenar =
     "en curso". Sólido = "hecho". El scroll nunca lo llena — solo tocar
     el botón de progreso en la tarjeta. El relleno usa --progress-frac
     (arriba) para poder animarse de verdad, no saltar de golpe.
     El "vacío" del conic-gradient es --bg (el fondo de la página, no
     transparent) — el dot vive sobre el spine, y con transparent la
     línea del spine se veía pasar por dentro del aro hueco, partiendo
     la tira en vez de una tira pareja con agujeros limpios. */
  .block-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid var(--cat-glow);
    --progress-frac: 0%;
    background: conic-gradient(var(--cat-glow) var(--progress-frac), var(--bg) var(--progress-frac));
    flex: 0 0 auto;
    transition: --progress-frac var(--dur-base) var(--ease-in-out), box-shadow var(--dur-base) var(--ease-in-out);
  }
  .block[data-progress="ongoing"] .block-dot {
    --progress-frac: 50%;
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--cat-glow) 22%, transparent);
  }
  .block[data-progress="done"] .block-dot {
    --progress-frac: 100%;
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--cat-glow) 30%, transparent);
  }

  /* la doble-cápsula queda neutralizada: el shell es solo un envoltorio de paso,
     la tarjeta interna lleva toda la superficie (soft shadow, no vidrio) */
  .bezel-shell {
    background: none;
    border: none;
    padding: 0;
    border-radius: 0;
  }

  /* Tarjetas con un poco de 3D: bisel superior (filo de luz), sombra de canto
     inferior, y una inclinación leve en reposo (perspective+rotateX) que se
     aplana al abrir o al presionar — profundidad real, no un drop-shadow genérico. */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow:
      inset 0 1px 0 oklch(1 0 0 / 0.75),
      inset 0 -1px 0 oklch(0.3 0.05 265 / 0.05),
      0 1px 2px oklch(0.3 0.05 265 / 0.05),
      0 16px 28px -16px oklch(0.3 0.05 265 / 0.22),
      0 4px 22px -12px color-mix(in oklch, var(--cat-glow) 45%, transparent);
    overflow: hidden;
    transform: perspective(1000px) rotateX(1.5deg);
    transform-origin: 50% 0%;
    transition: box-shadow var(--dur-base) var(--ease-out), transform var(--dur-settle) var(--ease-out);
  }
  .card[data-open="true"] {
    transform: perspective(1000px) rotateX(0deg);
  }
  /* .is-pressed la pone/quita JS (pointerdown/up/cancel/leave), no :active —
     en iOS Safari :active se puede quedar "pegado" en elementos no nativos
     (role=button) si no hay un listener de touch de verdad en el elemento;
     con JS el estado se limpia siempre, sin depender de que el navegador
     decida cuándo se considera "soltado". También reemplaza el viejo
     :has(.card-head:active), que dependía del mismo :active poco fiable. */
  .card.is-pressed {
    transform: perspective(1000px) rotateX(0deg) scale(0.97);
    transition: transform var(--dur-instant) var(--ease-out);
  }
  .block[data-status="pending"] .card,
  .card.is-pending {
    border-style: dashed;
    border-color: var(--pending);
    background: color-mix(in oklch, var(--pending) 6%, var(--surface));
  }

  /* Pulso al pasar de "nada" a "en curso": box-shadow redeclarado completo
     en cada keyframe (no clip por overflow:hidden — box-shadow nunca lo
     recorta su propio elemento) + un leve zoom. Un solo golpe, sin rebote. */
  @keyframes cardPulse {
    0%, 100% {
      transform: perspective(1000px) rotateX(1.5deg) scale(1);
      box-shadow:
        inset 0 1px 0 oklch(1 0 0 / 0.75),
        inset 0 -1px 0 oklch(0.3 0.05 265 / 0.05),
        0 1px 2px oklch(0.3 0.05 265 / 0.05),
        0 16px 28px -16px oklch(0.3 0.05 265 / 0.22),
        0 4px 22px -12px color-mix(in oklch, var(--cat-glow) 45%, transparent),
        0 0 0 0 color-mix(in oklch, var(--cat-glow) 0%, transparent);
    }
    40% {
      transform: perspective(1000px) rotateX(1.5deg) scale(1.035);
      box-shadow:
        inset 0 1px 0 oklch(1 0 0 / 0.75),
        inset 0 -1px 0 oklch(0.3 0.05 265 / 0.05),
        0 1px 2px oklch(0.3 0.05 265 / 0.05),
        0 16px 28px -16px oklch(0.3 0.05 265 / 0.22),
        0 4px 22px -12px color-mix(in oklch, var(--cat-glow) 45%, transparent),
        0 0 26px 6px color-mix(in oklch, var(--cat-glow) 55%, transparent);
    }
  }
  .card.is-pulsing { animation: cardPulse 550ms var(--ease-out); }

  /* Confetti/serpentinas al marcar "hecho" — vive en .block (no en .card,
     que tiene overflow:hidden y las recortaría antes de que salgan). */
  .confetti-layer {
    position: absolute;
    left: 28px;
    right: 0;
    top: 0;
    height: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 3;
  }
  .confetti-piece {
    position: absolute;
    top: 22px;
    width: 6px;
    height: 6px;
    background: var(--piece-color, var(--cat-glow));
    border-radius: 1px;
    opacity: 0;
    animation: confettiBurst 750ms var(--ease-out) both;
    animation-delay: var(--delay, 0ms);
  }
  .confetti-piece.is-streamer {
    width: 3px;
    height: 16px;
    border-radius: 2px;
  }
  @keyframes confettiBurst {
    0%   { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.6); }
    14%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 48px)) rotate(var(--rot)) scale(1); }
  }

  /* Sigue en uso fuera del timeline: estado del hotel (Antes de viajar) y
     el placeholder pendiente del vuelo de Pao (Documentos). Ahí "confirmado
     / por confirmar" sí es la información correcta — es planeación, no
     ejecución del día. */
  .status-pill {
    flex: 0 0 auto;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    background: color-mix(in oklch, var(--confirmed) 18%, transparent);
    color: var(--confirmed);
    white-space: nowrap;
  }
  .status-pill.is-pending {
    background: color-mix(in oklch, var(--pending) 20%, transparent);
    color: oklch(0.42 0.13 75);
  }

  .card-head {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    padding: var(--space-lg);
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    min-height: 44px;
    transition: transform var(--dur-settle) var(--ease-out);
  }
  .card.is-pressed .card-head {
    transform: scale(0.97);
    transition: transform var(--dur-instant) var(--ease-out);
  }
  .card-head:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: -2px;
  }

  .card-head-top {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    perspective: 500px;
  }
  .block-time {
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-strong);
    background: color-mix(in oklch, var(--accent) 8%, var(--bg-elevated));
    border-radius: 999px;
    padding: 5px 12px;
    line-height: 1.1;
    white-space: nowrap;
    transition: box-shadow var(--dur-settle) var(--ease-out);
  }
  /* Al tocar la tarjeta, la hora y el tipo se resaltan con el color de
     categoría — mismo trigger (.is-pressed) y misma pareja de tiempos
     que el zoom de la tarjeta (--dur-instant al bajar, --dur-settle al
     soltar) para que las tres cosas (tarjeta, hora, tipo) se sientan
     como un solo gesto, no tres animaciones sueltas. */
  .card.is-pressed .block-time {
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--cat-glow) 32%, transparent);
    transition: box-shadow var(--dur-instant) var(--ease-out);
  }
  .cat-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cat-glow);
    white-space: nowrap;
    transition: text-shadow var(--dur-settle) var(--ease-out);
  }
  .card.is-pressed .cat-label {
    text-shadow: 0 0 8px color-mix(in oklch, var(--cat-glow) 55%, transparent);
    transition: text-shadow var(--dur-instant) var(--ease-out);
  }
  .card-head-spacer { flex: 1 1 auto; }

  .card-title-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card-title {
    font-family: var(--font-display);
    font-size: 1.08rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-location {
    font-size: 0.8rem;
    color: var(--text-faint);
  }
  .card-desc {
    font-size: 0.86rem;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.48;
  }

  /* Botón de progreso tri-estado: nada (aro vacío) → en curso (aro medio
     lleno, conic-gradient) → hecho (círculo sólido + check). Reemplaza el
     pill de "Confirmado" — ya no describe planeación, describe si ya se
     hizo. Botón real (no el <div role=button> de .card-head) para poder
     vivir dentro sin anidar <button> dentro de <button>. */
  .progress-btn {
    position: relative;
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    /* la bajada del press la pone :active (más rápida); esta gobierna la vuelta al soltar */
    transition: transform var(--dur-settle) var(--ease-out);
  }
  .progress-btn:active {
    transform: scale(0.85);
    transition: transform var(--dur-instant) var(--ease-out);
  }
  .progress-btn:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 1px;
  }
  /* Aro siempre del color de categoría (igual que el dot) — el relleno usa
     --progress-frac, así que "nada→en curso→hecho" es un llenado de
     verdad, no un salto de golpe. */
  .progress-ring {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--cat-glow);
    --progress-frac: 0%;
    background: conic-gradient(var(--cat-glow) var(--progress-frac), transparent var(--progress-frac));
    transition: --progress-frac var(--dur-base) var(--ease-in-out);
  }
  .progress-btn[data-progress="ongoing"] .progress-ring { --progress-frac: 50%; }
  .progress-btn[data-progress="done"] .progress-ring { --progress-frac: 100%; }
  /* El check no aparece de golpe — se superpone al aro ya lleno (el aro
     NO se oculta) con un fundido + pop, con un pequeño delay para que se
     alcance a ver el aro llenarse del todo antes de que aparezca el check. */
  .progress-check {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    color: var(--surface);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .progress-btn[data-progress="done"] .progress-check {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    transition: opacity var(--dur-fast) var(--ease-out) var(--dur-base), transform var(--dur-fast) var(--ease-out) var(--dur-base);
  }

  /* Chevron directo del manual — cheurón simple, sin cápsula circular
     de fondo, tono secundario. Es un indicador de disclosure, no un
     botón aparte (el tap ya es de toda la fila). */
  .chevron {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--text-faint);
    transition: transform var(--dur-base) var(--ease-in-out);
  }
  .card[data-open="true"] .chevron { transform: rotate(180deg); }

  .card-body-wrap {
    display: grid;
    grid-template-rows: 0fr;
    /* cierre: rápido, sin demora — el contenido no debe quedar visible mientras la fila ya colapsó */
    transition: grid-template-rows var(--dur-layout-out) var(--ease-in);
  }
  .card[data-open="true"] .card-body-wrap {
    grid-template-rows: 1fr;
    /* apertura: un poco más lenta que el cierre, curva de salida confiada */
    transition: grid-template-rows var(--dur-layout-in) var(--ease-out);
  }
  .card-body-inner { overflow: hidden; }
  .card-body {
    padding: 0 var(--space-lg) var(--space-lg);
    font-size: 0.86rem;
    color: var(--text-dim);
    line-height: 1.58;
    border-top: 1px solid var(--hairline);
    margin-top: var(--space-sm);
    padding-top: var(--space-md);
    opacity: 0;
    transform: translateY(-4px);
    /* cierre: fade rápido sin demora (antes tenía la misma demora que abrir — se veía el texto
       colgado mientras la fila ya se había encogido) */
    transition: opacity var(--dur-fast) var(--ease-in), transform var(--dur-fast) var(--ease-in);
  }
  .card[data-open="true"] .card-body {
    opacity: 1;
    transform: translateY(0);
    /* apertura: espera a que la fila abra un poco antes de revelar el texto */
    transition: opacity var(--dur-layout-in) var(--ease-out) 90ms, transform var(--dur-layout-in) var(--ease-out) 90ms;
  }
  .card-body p { margin: 0 0 var(--space-sm); }
  .card-body p:last-child { margin-bottom: 0; }

  .badge-warn {
    display: inline-flex;
    align-items: center;

    font-weight: 700;

  .food-options {

  }
  .food-options-label {

    color: var(--text-faint);
  }
  .food-opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-sm);
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);

  .food-opt-name { font-size: 0.85rem; font-weight: 600; }
  .food-opt-desc { font-size: 0.76rem; color: var(--text-faint); margin-top: 1px; }
  .food-tag {
    flex: 0 0 auto;

  .pretrip-when {
    display: block;

  .summary-grid { display: flex; flex-direction: column; gap: var(--space-xl); }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow:
      inset 0 1px 0 oklch(1 0 0 / 0.7),
      0 1px 2px oklch(0.3 0.05 265 / 0.05),

  .summary-card h2 {
    font-family: var(--font-body);
    display: inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent-strong);
    background: color-mix(in oklch, var(--accent) 13%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 26%, transparent);

  }
  .summary-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-sm) 0;
    border-top: 1px solid var(--hairline);
  }
  .summary-row:first-of-type { border-top: none; }
  .summary-row-label {

  }
  .summary-row-value { font-size: 0.9rem; font-weight: 600; line-height: 1.4; }
  .summary-row-value.mono { font-variant-numeric: tabular-nums; }

  .allergy-card {
    background: color-mix(in oklch, var(--danger) 10%, var(--surface));
    border: 1px solid color-mix(in oklch, var(--danger) 40%, var(--border));
  }
  .allergy-card h2 {
    color: var(--danger);
    background: color-mix(in oklch, var(--danger) 16%, transparent);
    border-color: color-mix(in oklch, var(--danger) 36%, transparent);
  }
  .allergy-card p { margin: 0; font-size: 0.9rem; line-height: 1.5; }

  .pill-list { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
  .pill {
    font-size: 0.8rem;
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .hotel-options { display: flex; flex-direction: column; gap: var(--space-sm); }
  .hotel-opt {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    padding: var(--space-sm) var(--space-md);
    font-size: 0.85rem;
  }
  .hotel-opt-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm); }
  .hotel-opt[data-picked="true"] {
    border-color: var(--accent);
    background: color-mix(in oklch, var(--accent) 9%, var(--bg-elevated));
  }
  .hotel-name { font-weight: 600; }
  .hotel-price { color: var(--text-faint); font-size: 0.78rem; }
  .hotel-opt-note { font-size: 0.76rem; color: var(--text-faint); line-height: 1.4; margin-top: 2px; }

  .checklist { display: flex; flex-direction: column; gap: var(--space-sm); margin-bottom: var(--space-lg); }
  .check-row {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: 0 1px 2px oklch(0.3 0.05 265 / 0.04);
    cursor: pointer;
    min-height: 44px;
    transition: background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-settle) var(--ease-out);
  }
  .check-row:active { transform: scale(0.97); transition: background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out); }
  .check-box {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 1.5px solid var(--border-strong);
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: background var(--dur-base) var(--ease-in-out), border-color var(--dur-base) var(--ease-in-out), color var(--dur-fast) var(--ease-out), transform var(--dur-base) var(--ease-in-out);
  }
  .check-row.is-checked .check-box {
    background: var(--confirmed);
    border-color: var(--confirmed);
    color: var(--surface);
    transform: scale(1.05);
  }
  .check-box svg {
    transform: scale(0.4);
    transition: transform var(--dur-base) var(--ease-out);
  }
  .check-row.is-checked .check-box svg { transform: scale(1); }
  .check-label { font-size: 0.92rem; line-height: 1.4; transition: color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); }
  .check-row.is-checked .check-label { color: var(--text-faint); text-decoration: line-through; opacity: 0.7; }

  .ropa-columns { display: flex; flex-direction: column; gap: var(--space-2xl); }
  .ropa-col-title {
    font-family: var(--font-display);
    font-size: 1.02rem;
    font-weight: 600;
    margin: 0 0 var(--space-md);
  }

  .contact-card-value { font-size: 0.95rem; font-weight: 600; margin-top: 2px; }
  .contact-card-note { font-size: 0.8rem; color: var(--text-faint); margin-top: 4px; line-height: 1.4; }
  .contact-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-md); }
  .contact-link {
    flex: 1;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-sm);
    transition: background var(--dur-fast) var(--ease-out), transform var(--dur-settle) var(--ease-out);
  }
  .contact-link:active { transform: scale(0.95); transition: background var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out); }
  .contact-link.is-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  footer.credits {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.72rem;
    padding: var(--space-xl) 0 var(--space-lg);
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .day-panel[data-active="true"] > * {
    animation: riseIn 0.65s var(--ease-entrance) both;
  }
  .day-panel[data-active="true"] > .day-heading { animation-delay: 0s; }
  .day-panel[data-active="true"] > .day-note { animation-delay: 0.04s; }
  .day-panel[data-active="true"] .timeline > .block,
  .day-panel[data-active="true"] .checklist > * {
    animation: riseIn 0.55s var(--ease-entrance) both;
  }
  /* nth-of-type, no nth-child: el spine es un <div> hermano no-.block dentro de
     .timeline, así que contar "hijo N" a secas correría el índice de las tarjetas */
  .day-panel[data-active="true"] .timeline > .block:nth-of-type(1),
  .day-panel[data-active="true"] .checklist > *:nth-child(1) { animation-delay: 0.05s; }
  .day-panel[data-active="true"] .timeline > .block:nth-of-type(2),
  .day-panel[data-active="true"] .checklist > *:nth-child(2) { animation-delay: 0.1s; }
  .day-panel[data-active="true"] .timeline > .block:nth-of-type(3),
  .day-panel[data-active="true"] .checklist > *:nth-child(3) { animation-delay: 0.15s; }
  .day-panel[data-active="true"] .timeline > .block:nth-of-type(4),
  .day-panel[data-active="true"] .checklist > *:nth-child(4) { animation-delay: 0.2s; }
  .day-panel[data-active="true"] .timeline > .block:nth-of-type(5),
  .day-panel[data-active="true"] .checklist > *:nth-child(5) { animation-delay: 0.25s; }
  .day-panel[data-active="true"] .timeline > .block:nth-of-type(n+6),
  .day-panel[data-active="true"] .checklist > *:nth-child(n+6) { animation-delay: 0.3s; }
  .day-panel[data-active="true"] .summary-grid > * { animation: riseIn 0.55s var(--ease-entrance) both; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(1) { animation-delay: 0.04s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(2) { animation-delay: 0.09s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(3) { animation-delay: 0.14s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(4) { animation-delay: 0.19s; }
  .day-panel[data-active="true"] .summary-grid > *:nth-child(n+5) { animation-delay: 0.24s; }

  /* Flight-board scroll reveal — por tarjeta, activado por scroll real.
     Firefox (sin animation-timeline: view()) usa el stagger de arriba en su lugar. */
  @supports (animation-timeline: view()) {
    .day-panel[data-active="true"] .timeline > * { animation: none !important; }

    .timeline > .block {
      /* Sin opacity:0 estático aquí a propósito: si el navegador nunca
         llega a resolver el animation-timeline (current time no resuelto),
         la animación simplemente no aplica y el elemento cae en su estilo
         normal — visible. Con opacity:0 fijo en la regla base, ese mismo
         caso deja la tarjeta invisible para siempre, sin manera de
         recuperarse. El fade-in real lo pone el propio keyframe (from). */
      animation: flapReveal 0.65s var(--ease-entrance) both;
      animation-timeline: view();
      animation-range: entry 0% entry 42%;
    }
    .timeline > .block .block-time {
      transform-origin: 50% 100%;
      animation: flapDigit 0.5s var(--ease-entrance) both;
      animation-timeline: view();
      animation-range: entry 6% entry 38%;
    }
  }
  @keyframes flapReveal {
    from { opacity: 0; transform: translateY(18px) scale(0.97); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes flapDigit {
    from { opacity: 0; transform: rotateX(-80deg); }
    to   { opacity: 1; transform: rotateX(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card-body-wrap, .card-body, .chevron, .tab-btn, .card-head, .mode-btn, .check-row, .check-box, .check-box svg, .contact-link,
    .progress-btn, .progress-ring, .progress-check, .block-dot, .confetti-piece, .cat-label,
    .day-panel[data-active="true"] > *, .day-panel[data-active="true"] .timeline > *,
    .day-panel[data-active="true"] .checklist > *, .day-panel[data-active="true"] .summary-grid > *,
    .timeline > .block, .timeline > .block .block-time {
      transition: none !important;
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    /* confetti se salta por completo en JS (matchMedia) — esto es respaldo
       por si algún nodo llegara a crearse igual */
    .confetti-layer { display: none !important; }
    /* el spine no depende de scroll para mostrar su color — informativo, no espectáculo */
    .spine-fill {
      --reveal: 100% !important;
      transition: none !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
    }
  }

  @media (min-width: 720px) {
    main { max-width: 760px; }
    .ropa-columns { flex-direction: row; align-items: flex-start; }
    .ropa-columns > * { flex: 1; }
    #panel-pretrip .summary-grid,
    #panel-seguridad .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-xl);
    }
  }
</style>

<div class="app-bar">

<script>
"use strict";

function deepFreeze(obj) {
  Object.getOwnPropertyNames(obj).forEach(function (key) {
    var val = obj[key];
    if (val && typeof val === "object") deepFreeze(val);
  });
  return Object.freeze(obj);
}

// ---------------------------------------------------------------
// FIXED_DATA — datos confirmados de logística dura. NO EDITAR estos
// valores salvo que el dato real cambie (ej. reasignan asiento).
// Congelado a propósito: un typo aquí es un vuelo perdido, no un bug de UI.
// ---------------------------------------------------------------
const FIXED_DATA = deepFreeze({
  flights: {
    outbound: {
      airline: "Aeroméxico",
      date: "Vie 25 sept 2026",
      route: "MEX → SFO",
      depart: "17:20",
      arrive: "21:10",

const REQUIRED_BLOCK_FIELDS = ["time", "title", "status"];

function validateTripData(data) {
  const errors = [];
  if (!Array.isArray(data.pretrip)) errors.push("pretrip debe ser un array");
  if (!Array.isArray(data.days)) errors.push("days debe ser un array");
  (data.days || []).forEach(function (day, i) {
    if (!day.key || !day.tab || !day.heading) errors.push("days[" + i + "] falta key/tab/heading");
    if (!Array.isArray(day.blocks)) { errors.push("days[" + i + "] falta blocks[]"); return; }
    day.blocks.forEach(function (block, j) {
      REQUIRED_BLOCK_FIELDS.forEach(function (field) {
        if (!block[field]) errors.push("days[" + i + "].blocks[" + j + "] falta '" + field + "'");
      });
      if (block.status !== "confirmed" && block.status !== "pending") {
        errors.push("days[" + i + "].blocks[" + j + "] status inválido: " + block.status);
      }
    });
  });
  if (errors.length) {
    console.error("TRIP_DATA inválido:\n- " + errors.join("\n- "));
  }
  return errors.length === 0;
}

// ---------------------------------------------------------------
// Spine continuo del timeline — una tira por día, coloreada por categoría
// de tarjeta (vuelo/traslado/actividad/comida/evento/libre), no por
// posición. layoutSpine mide los dots reales (getBoundingClientRect) para
// que el degradado y el alto de la tira sigan al layout de verdad —
// incluye tarjetas abiertas/cerradas, que cambian de alto. El dot mismo
// (.block-dot) usa el mismo color de categoría pero su relleno es aparte:
// lo gobierna el progreso (nada/en curso/hecho), nunca el scroll.
// ---------------------------------------------------------------
function categoryColorVar(cat) {
  return "var(--cat-" + (cat || "rest") + ")";
}

function buildSpineGradient(relY, cats) {
  if (relY.length === 1) return categoryColorVar(cats[0]);
  const total = relY[relY.length - 1] || 1;
  const colors = cats.map(categoryColorVar);
  const blend = 3; // % de mezcla alrededor de cada punto medio entre tarjetas
  const stops = [colors[0] + " 0%"];
  for (let i = 1; i < relY.length; i++) {
    const mid = ((relY[i - 1] + relY[i]) / 2 / total) * 100;
    stops.push(colors[i - 1] + " " + Math.max(0, mid - blend).toFixed(1) + "%");
    stops.push(colors[i] + " " + Math.min(100, mid + blend).toFixed(1) + "%");
  }
  stops.push(colors[colors.length - 1] + " 100%");
  return "linear-gradient(to bottom, " + stops.join(", ") + ")";
}

function layoutSpine(timeline) {
  const spine = timeline.querySelector(".spine");
  if (!spine) return;
  const dots = Array.from(timeline.querySelectorAll(".block-dot"));
  if (!dots.length) { spine.style.display = "none"; return; }
  spine.style.display = "";
  const timelineRect = timeline.getBoundingClientRect();
  const dotYs = dots.map(function (d) {
    const r = d.getBoundingClientRect();
    return (r.top + r.height / 2) - timelineRect.top;
  });
  const cats = Array.from(timeline.querySelectorAll(".block")).map(function (b) {
    return b.dataset.cat || "rest";
  });
  const top = dotYs[0];
  const height = Math.max(1, dotYs[dotYs.length - 1] - top);
  spine.style.top = top + "px";
  spine.style.height = height + "px";
  const relY = dotYs.map(function (y) { return y - top; });
  const fill = spine.querySelector(".spine-fill");
  fill.style.background = buildSpineGradient(relY, cats);
}

// ResizeObserver cubre TODOS los casos que invalidan el layout del spine con un
// solo mecanismo: activar un día (pasa de display:none a visible), abrir/cerrar
// una tarjeta, o un resize de ventana que reflowea el texto.
function watchSpine(timeline) {
  if (!("ResizeObserver" in window)) { layoutSpine(timeline); return; }
  const ro = new ResizeObserver(function () { layoutSpine(timeline); });
  ro.observe(timeline);
}

// Reveal de "transparente al color de la tarjeta" conforme se hace scroll.
// Dos señales combinadas, la que dé más gana:
//  1) Línea de lectura: no la mitad exacta del viewport, sino ~38% desde
//     arriba — donde de verdad se concentra la mirada al leer en móvil.
//     El spine se llena hasta donde esa línea lo cruza.
//  2) Cercanía al fondo de LA PÁGINA (no del spine): si el spine es corto
//     (cabe entero en pantalla) la línea de lectura nunca lo cruza del
//     todo y se quedaría trabado por debajo de 100% para siempre — este
//     término fuerza a que, conforme se acerca al scroll máximo real,
//     el llenado se acerque a 100% en la misma proporción, sin importar
//     qué tan largo sea el día.
// Piso fijo de 8% para que arriba del todo ya se vea un poco cubriendo
// el primer punto, en vez de arrancar en blanco. Un solo listener global
// (no uno por día) que sigue al día ACTIVO — el resto están display:none.
let spineRevealTick = null;
function setupSpineReveal(panelsTripEl) {
  const READ_LINE_FRAC = 0.38;
  let ticking = false;
  function update() {
    ticking = false;
    const fill = panelsTripEl.querySelector('.day-panel[data-active="true"] .spine-fill');
    if (!fill) return;
    const rect = fill.getBoundingClientRect();
    if (rect.height <= 0) return;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const readLineY = vh * READ_LINE_FRAC;
    const pctByReadLine = Math.max(0, Math.min(100, ((readLineY - rect.top) / rect.height) * 100));
    const maxScroll = Math.max(1, document.documentElement.scrollHeight - vh);
    const pctByPageBottom = Math.min(100, (window.scrollY / maxScroll) * 100);
    const floor = 8;
    const pct = Math.max(pctByReadLine, pctByPageBottom, floor);
    fill.style.setProperty("--reveal", pct.toFixed(1) + "%");
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  update();
  spineRevealTick = update;
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach(function (c) {
    if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

// Cheurón directo, sin cápsula de fondo — es indicador de disclosure,
// no un botón aparte (manual de diseño: el tap de toda la fila ya expande).
function chevronSvg() {
  const chevron = document.createElement("span");
  chevron.className = "chevron";
  chevron.innerHTML = '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return chevron;
}

// Double-bezel: wrapper de paso (visualmente neutro, ver CSS .bezel-shell).
function shell(coreNode, extraClass) {

}

// ---------------------------------------------------------------
// Progreso por tarjeta — nada → en curso → hecho, tri-estado, tap-to-cycle.
// Reemplaza el pill de "Confirmado" (planeación) por algo que describe si
// ya se hizo (ejecución del día). Persiste por dispositivo, igual que los
// checklists — no sincroniza entre teléfonos.
// ---------------------------------------------------------------
const PROGRESS_STATES = ["none", "ongoing", "done"];
function nextProgress(state) {
  const i = PROGRESS_STATES.indexOf(state);
  return PROGRESS_STATES[(i + 1) % PROGRESS_STATES.length];
}
function loadProgress(id) {
  try { return localStorage.getItem("trip_progress_" + id) || "none"; }
  catch (e) { return "none"; }
}
function saveProgress(id, state) {
  try { localStorage.setItem("trip_progress_" + id, state); }
  catch (e) { /* localStorage unavailable — state just won't persist */ }
}

const CAT_LABELS = { flight: "Vuelo", transfer: "Transporte", activity: "Actividad", food: "Comida", event: "Evento", rest: "Libre" };
function categoryLabel(cat) { return CAT_LABELS[cat] || CAT_LABELS.rest; }

// Botón real (no anidado dentro del <div role="button"> de la tarjeta —
// evita <button> dentro de <button>, inválido en HTML).
function progressBtn() {
  const btn = el("button", {
    class: "progress-btn", type: "button", "data-progress": "none",
    "aria-label": "Marcar progreso"
  }, [
    el("span", { class: "progress-ring" }),
    checkSvg()
  ]);
  btn.querySelector("svg").classList.add("progress-check");
  return btn;
}

function applyProgress(blockEl, state) {
  blockEl.dataset.progress = state;
  const btn = blockEl.querySelector(".progress-btn");
  if (btn) btn.dataset.progress = state;
}

function prefersReducedMotion() {
  return typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

// Pulso de "nada → en curso": zoom leve + glow, un solo golpe. Se puede
// re-disparar (el forced reflow permite reiniciar la animación si el
// usuario cicla rápido nada→curso→hecho→nada→curso otra vez).
function pulseCard(card) {
  if (prefersReducedMotion()) return;
  card.classList.remove("is-pulsing");
  void card.offsetWidth;
  card.classList.add("is-pulsing");
  card.addEventListener("animationend", function handler(e) {
    if (e.animationName === "cardPulse") {
      card.classList.remove("is-pulsing");
      card.removeEventListener("animationend", handler);
    }
  });
}

// Confetti/serpentinas al marcar "hecho" — generado a mano, sin librería
// (mismo criterio que el reveal del spine: nada que el navegador no
// resuelva ya con transform+opacity). Vive en .block, no en .card, para
// no quedar recortado por el overflow:hidden de la tarjeta.
const CONFETTI_COLORS = ["var(--cat-flight)", "var(--cat-activity)", "var(--cat-food)", "var(--cat-event)", "var(--cat-transfer)"];
function burstConfetti(blockEl) {
  if (prefersReducedMotion()) return;
  const layer = el("div", { class: "confetti-layer", "aria-hidden": "true" });
  const count = 16;
  for (let i = 0; i < count; i++) {
    const isStreamer = i % 5 === 0;
    const piece = el("span", { class: "confetti-piece" + (isStreamer ? " is-streamer" : "") });
    const angle = Math.random() * 140 - 70; // grados desde vertical, -70..70
    const dist = 40 + Math.random() * 55;
    const rad = (angle * Math.PI) / 180;
    const dx = Math.sin(rad) * dist;
    const dy = -Math.abs(Math.cos(rad) * dist) - 10;
    piece.style.setProperty("--dx", dx.toFixed(0) + "px");
    piece.style.setProperty("--dy", dy.toFixed(0) + "px");
    piece.style.setProperty("--rot", (Math.random() * 520 - 260).toFixed(0) + "deg");
    piece.style.setProperty("--delay", (Math.random() * 90).toFixed(0) + "ms");
    piece.style.setProperty("--piece-color", CONFETTI_COLORS[i % CONFETTI_COLORS.length]);
    piece.style.left = (40 + Math.random() * 20).toFixed(0) + "%";
    layer.appendChild(piece);
  }
  blockEl.appendChild(layer);
  setTimeout(function () { layer.remove(); }, 1000);
}

function renderFoodOptions(food) {
  const wrap = el("div", { class: "food-options" }, [
    el("div", { class: "food-options-label" }, [food.label])
  ]);
  food.options.forEach(function (opt) {
    wrap.appendChild(el("div", { class: "food-opt" }, [
      el("div", null, [
        el("div", { class: "food-opt-name" }, [opt.name]),
        el("div", { class: "food-opt-desc" }, [opt.desc])
      ]),
      el("span", { class: "food-tag", "data-kind": opt.tag }, [opt.tag === "walk" ? "Walkable" : "Vale la pena"])
    ]));
  });
  return wrap;
}

function renderBlock(block, id) {
  const status = block.status === "pending" ? "pending" : "confirmed";
  const hasBody = block.notes || block.food || block.warn;
  const cat = block.cat || "rest";

  const headTop = el("div", { class: "card-head-top" }, [
    el("span", { class: "block-time" }, [block.time]),
    el("span", { class: "cat-label" }, [categoryLabel(cat)]),
    el("span", { class: "card-head-spacer" }),
    progressBtn()
  ]);
  if (hasBody) headTop.appendChild(chevronSvg());

  const titleGroup = el("div", { class: "card-title-group" }, [
    el("div", { class: "card-title" }, [block.title]),
    block.location ? el("div", { class: "card-location" }, [block.location]) : null,
    block.desc ? el("div", { class: "card-desc" }, [block.desc]) : null
  ]);

  // <div role="button">, no <button>: el botón de progreso vive dentro y
  // <button> no puede anidar <button> (HTML inválido). El teclado se
  // maneja a mano en bindExpandDelegate, mismo patrón que .check-row.
  const head = el("div", { class: "card-head", role: "button", tabindex: "0", "aria-expanded": "false" }, [headTop, titleGroup]);

  const card = el("div", { class: "card", "data-open": "false" }, [head]);

  if (hasBody) {
    const bodyContent = el("div", { class: "card-body" });
    if (block.warn) {
      bodyContent.appendChild(el("span", { class: "badge-warn" }, [warnSvg(), "Importante"]));
      bodyContent.appendChild(el("p", null, [block.warn]));
    }
    if (block.notes) bodyContent.appendChild(el("p", null, [block.notes]));
    if (block.food) bodyContent.appendChild(renderFoodOptions(block.food));

    const inner = el("div", { class: "card-body-inner" }, [bodyContent]);
    const bodyWrap = el("div", { class: "card-body-wrap" }, [inner]);
    card.appendChild(bodyWrap);
  } else {
    head.style.cursor = "default";
  }

  const dotCol = el("div", { class: "block-time-col" }, [
    el("div", { class: "block-dot" })
  ]);

  const blockEl = el("article", {
    class: "block", "data-status": status, "data-cat": cat, "data-id": id, "data-progress": "none"
  }, [dotCol, shell(card)]);
  blockEl.style.setProperty("--cat-glow", categoryColorVar(cat));
  return blockEl;
}

// Delegación: un solo listener por panel, no uno por tarjeta.
function bindExpandDelegate(container) {
  function toggle(head) {
    const card = head.closest(".card");
    if (!card || !card.querySelector(".card-body-wrap")) return;
    const open = card.getAttribute("data-open") === "true";
    card.setAttribute("data-open", open ? "false" : "true");
    head.setAttribute("aria-expanded", open ? "false" : "true");
  }
  container.addEventListener("click", function (event) {
    if (event.target.closest(".progress-btn")) return;
    const head = event.target.closest(".card-head");
    if (!head || !container.contains(head)) return;
    toggle(head);
  });
  container.addEventListener("keydown", function (event) {
    if (event.key !== " " && event.key !== "Enter") return;
    if (event.target.closest(".progress-btn")) return;
    const head = event.target.closest(".card-head");
    if (!head || !container.contains(head)) return;
    event.preventDefault();
    if (!event.repeat) setCardPressed(head, true);
    toggle(head);
  });
  container.addEventListener("keyup", function (event) {
    if (event.key !== " " && event.key !== "Enter") return;
    const head = event.target.closest(".card-head");
    if (!head || !container.contains(head)) return;
    setCardPressed(head, false);
  });

  // Estado de "presionado" vía pointer events, no :active — en iOS Safari
  // :active puede quedarse pegado en elementos no nativos (role=button)
  // tras soltar el toque, dejando la tarjeta atorada en su look de
  // presionada. setPointerCapture ata el pointerId al propio card-head
  // en cuanto baja el dedo, así que pointerup/pointercancel SIEMPRE le
  // llegan a él sin importar a dónde se mueva el dedo mientras está
  // abajo — se limpia garantizado, no depende de bordes/leave events.
  container.addEventListener("pointerdown", function (event) {
    if (event.target.closest(".progress-btn")) return;
    const head = event.target.closest(".card-head");
    if (!head || !container.contains(head)) return;
    setCardPressed(head, true);
    try { head.setPointerCapture(event.pointerId); } catch (e) { /* no soportado — pointerup abajo sigue funcionando en el caso normal */ }
  });
  ["pointerup", "pointercancel"].forEach(function (evtName) {
    container.addEventListener(evtName, function (event) {
      const head = event.target.closest(".card-head");
      if (!head || !container.contains(head)) return;
      setCardPressed(head, false);
    });
  });
}

function setCardPressed(head, pressed) {
  const card = head.closest(".card");
  if (card) card.classList.toggle("is-pressed", pressed);
}

// Delegación del botón de progreso — cicla nada→en curso→hecho→nada y
// dispara el pulso/confetti correspondiente. stopPropagation no hace
// falta: el guard ".progress-btn" en bindExpandDelegate ya evita que el
// mismo tap también abra/cierre la tarjeta.
function bindProgressDelegate(container) {
  container.addEventListener("click", function (event) {
    const btn = event.target.closest(".progress-btn");
    if (!btn || !container.contains(btn)) return;
    const blockEl = btn.closest(".block");
    if (!blockEl) return;
    const current = blockEl.dataset.progress || "none";
    const next = nextProgress(current);
    applyProgress(blockEl, next);
    saveProgress(blockEl.dataset.id, next);
    const card = blockEl.querySelector(".card");
    if (next === "ongoing" && card) pulseCard(card);
    if (next === "done") burstConfetti(blockEl);
  });
}

function hydrateProgress(root) {
  root.querySelectorAll(".block[data-id]").forEach(function (blockEl) {
    const state = loadProgress(blockEl.dataset.id);
    if (state !== "none") applyProgress(blockEl, state);
  });
}

function renderCheckRow(item, storageKey) {
  const box = el("span", { class: "check-box" }, [checkSvg()]);
  const label = el("span", { class: "check-label" }, [item.label]);
  const row = el("div", {
    class: "check-row", role: "checkbox", tabindex: "0",
    "aria-checked": "false", "data-key": storageKey
  }, [box, label]);
  return row;
}

function renderChecklist(items, keyPrefix) {
  const wrap = el("div", { class: "checklist" });
  items.forEach(function (item) {
    wrap.appendChild(renderCheckRow(item, keyPrefix + "_" + item.key));
  });
  return wrap;
}

// Delegación: toggle de checkbox + persistencia en localStorage.
function bindChecklistDelegate(container) {
  function toggle(row) {
    const checked = row.getAttribute("aria-checked") === "true";
    row.setAttribute("aria-checked", checked ? "false" : "true");
    row.classList.toggle("is-checked", !checked);
    saveCheck(row.dataset.key, !checked);
  }
  container.addEventListener("click", function (event) {
    const row = event.target.closest(".check-row");
    if (!row || !container.contains(row)) return;
    toggle(row);
  });
  container.addEventListener("keydown", function (event) {
    if (event.key !== " " && event.key !== "Enter") return;
    const row = event.target.closest(".check-row");
    if (!row || !container.contains(row)) return;
    event.preventDefault();
    toggle(row);
  });
}

function hydrateChecklists(root) {
  root.querySelectorAll(".check-row").forEach(function (row) {
    if (loadCheck(row.dataset.key)) {
      row.setAttribute("aria-checked", "true");
      row.classList.add("is-checked");
    }
  });
}

function renderDayPanel(day) {
  const panel = el("section", { class: "day-panel", id: "panel-" + day.key, role: "tabpanel", "aria-labelledby": "tab-" + day.key });
  panel.appendChild(el("h2", { class: "day-heading" }, [day.heading]));
  const timeline = el("div", { class: "timeline" });
  const spine = el("div", { class: "spine", "aria-hidden": "true" }, [
    el("div", { class: "spine-track" }),
    el("div", { class: "spine-fill" })
  ]);
  timeline.appendChild(spine);
  day.blocks.forEach(function (b, i) { timeline.appendChild(renderBlock(b, day.key + "-" + i)); });
  panel.appendChild(timeline);
  watchSpine(timeline);
  return panel;
}

      ]),

function summaryRow(label, value, mono) {
  return el("div", { class: "summary-row" }, [

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------

function makeTabGroup(config) {
  config.tabs.forEach(function (t) {
    const btn = el("button", {
      class: "tab-btn", type: "button", role: "tab",
      id: "tab-" + t.key, "aria-controls": "panel-" + t.key,
      "aria-selected": "false"
    }, [t.label]);
    btn.addEventListener("click", function () { activateInGroup(config, t.key); });
    config.navEl.appendChild(btn);
    config.panelsEl.appendChild(t.panel);
  });
  return config;
}

function activateInGroup(config, key) {
  config.navEl.querySelectorAll(".tab-btn").forEach(function (b) {
    b.setAttribute("aria-selected", b.id === "tab-" + key ? "true" : "false");
  });
  config.panelsEl.querySelectorAll(".day-panel").forEach(function (p) {
    p.setAttribute("data-active", p.id === "panel-" + key ? "true" : "false");
  });
  const activeBtn = document.getElementById("tab-" + key);
  if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  config.activeKey = key;
  if (spineRevealTick) spineRevealTick();
}

function setMode(mode, groups) {
  const isTrip = mode === "trip";
  document.getElementById("mode-trip").setAttribute("aria-selected", isTrip ? "true" : "false");
  document.getElementById("mode-info").setAttribute("aria-selected", isTrip ? "false" : "true");

  groups.trip.navEl.hidden = !isTrip;
  groups.trip.panelsEl.hidden = !isTrip;
  groups.info.navEl.hidden = isTrip;
  groups.info.panelsEl.hidden = isTrip;
  if (isTrip && spineRevealTick) spineRevealTick();
}

function boot() {
  validateTripData(TRIP_DATA);

  const tabsTrip = document.getElementById("tabs-trip");
  const panelsTrip = document.getElementById("panels-trip");
  const tabsInfo = document.getElementById("tabs-info");
  const panelsInfo = document.getElementById("panels-info");

  bindExpandDelegate(panelsTrip);
  bindExpandDelegate(panelsInfo);
  bindProgressDelegate(panelsTrip);
  bindChecklistDelegate(panelsInfo);

  const tripGroup = makeTabGroup({
    navEl: tabsTrip, panelsEl: panelsTrip,
    tabs: TRIP_DATA.days.map(function (d) { return { key: d.key, label: d.tab, panel: renderDayPanel(d) }; })
  });

  const infoGroup = makeTabGroup({
    navEl: tabsInfo, panelsEl: panelsInfo,
    tabs: [
      { key: "pretrip", label: "Antes de viajar", panel: renderPretripPanel() },
      { key: "documentos", label: "Documentos", panel: renderDocumentosPanel() },
      { key: "ropa", label: "Ropa", panel: renderRopaPanel() },
      { key: "seguridad", label: "Seguridad", panel: renderSeguridadPanel() }
    ]
  });

  hydrateChecklists(panelsInfo);
  hydrateProgress(panelsTrip);
  setupSpineReveal(panelsTrip);

  activateInGroup(tripGroup, TRIP_DATA.days[0].key);
  activateInGroup(infoGroup, "pretrip");

  const groups = { trip: tripGroup, info: infoGroup };
  setMode("trip", groups);

  document.getElementById("mode-trip").addEventListener("click", function () { setMode("trip", groups); });
  document.getElementById("mode-info").addEventListener("click", function () { setMode("info", groups); });
}

document.addEventListener("DOMContentLoaded", boot);
